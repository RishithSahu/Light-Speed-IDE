[workspace]
resolver = "2"
members = [
    "crates/log",
    "crates/perf",
    "crates/platform",
    "crates/scheduler",
    "crates/buffer",
    "crates/core",
    "app",
    "benchmarks",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lightspeed-ide/lightspeed"

[workspace.dependencies]
ls-log = { path = "crates/log" }
ls-perf = { path = "crates/perf" }
ls-platform = { path = "crates/platform" }
ls-scheduler = { path = "crates/scheduler" }
ls-buffer = { path = "crates/buffer" }
ls-core = { path = "crates/core" }

unicode-segmentation = "1.13"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
windows-sys = "0.61"
wgpu = "30.0"
winit = "0.30.12"
glyphon = "0.12"
pollster = "0.4"
# Force-directed graph layout for the dependency view. Chosen over writing
# one, and over the layered (Sugiyama) layout that came first: a layered
# layout ranks a dependency graph into a handful of very wide rows, which
# measured at 12218x210 px for this repository -- eleven screens across, with
# about seven of seventy-nine files legible at once. A force simulation packs
# the same graph into one round cluster that fits a window whole.
#
# `force_graph` earns its place on weight and licence. Weight: petgraph and
# four small crates, no proc-macros and no build script, against
# `graph-explorer-layout`, which pulls serde plus the syn/quote toolchain.
# Licence: `forceatlas2` is the better-known implementation and was rejected
# outright -- it is AGPL-3.0-only, which this MIT OR Apache-2.0 workspace
# cannot take. It hands back node positions and nothing else, so the drawing
# stays in `app/src/depgraph.rs`.
force_graph = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
panic = "unwind"

[profile.bench]
inherits = "release"

# Benchmarks and large-file tests are unusable in a debug build; keep deps optimized
# even in dev so `cargo test` on 100 MB documents finishes in reasonable time.
[profile.dev.package."*"]
opt-level = 2
